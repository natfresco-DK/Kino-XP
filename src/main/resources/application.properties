spring.application.name=KinoXP
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

kino.admin.username=${ADMIN_USERNAME:admin}
kino.admin.password=${ADMIN_PASSWORD}
kino.movie-operator.username=${MOVIE_OPERATOR_USERNAME:movie_operator}
kino.movie-operator.password=${MOVIE_OPERATOR_PASSWORD}
kino.reservation.username=${RESERVATION_USERNAME:reservation}
kino.reservation.password=${RESERVATION_PASSWORD}
