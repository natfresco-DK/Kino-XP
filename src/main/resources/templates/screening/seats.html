<!DOCTYPE html>

<head>

    <title>Sædeoversigt | KinoXP</title>
</head>

<body>

    <main class="main-content screening-page seat-page">

            <div class="screen">

            <div class="seat-map-wrapper">

        </section>

    </main>

</div>

<script th:src="@{/JS/sidebar.js}"></script>

</html>
