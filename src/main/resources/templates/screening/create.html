<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
    <title>Opret forestilling | KinoXP</title>
    <link rel="stylesheet" th:href="@{/CSS/base.css}">
    <link rel="stylesheet" th:href="@{/CSS/sidebar.css}">
    <link rel="stylesheet" th:href="@{/CSS/create-screening.css}">

</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content screening-page">
        <section class="content-section screening-form-card">
            <div class="header">
                <h1>Opret forestilling</h1>
            </div>

            <div class="form-container">
                <form id="screeningForm">
                    <div class="form-group">
                        <label for="movie">Film <span class="req">*</span></label>
                        <select id="movie" name="movie" required>
                            <option value="">Vælg film</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="screen">Sal <span class="req">*</span></label>
                        <select id="screen" name="screen" required>
                            <option value="">Vælg biografsal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="startTime">Starttidspunkt <span class="req">*</span></label>
                        <input type="datetime-local" id="startTime" name="startTime" required></div>

                    <div class="form-group">
                        <label for="endTime">Sluttidspunkt <span class="req">*</span></label>
                        <input type="datetime-local" id="endTime" name="endTime" required></div>

                    <div class="button-group">
                        <button type="submit" id="submitBtn">Opret forestilling</button>
                        <button type="reset" id="resetBtn" class="cancel">Annuller</button>
                    </div>
                </form>
            </div>
            <p class="message" id="status" role="status"></p>
        </section>


        <section class="content-section screening-list-card">
            <div class="header">
                <h2>Eksisterende forestillinger</h2>
            </div>

            <div class="table-container">
                <table id="screeningsTable">
                    <thead>
                    <tr>
                        <th>Film</th>
                        <th>Sal</th>
                        <th>Starttidspunkt</th>
                        <th>Sluttidspunkt</th>
                        <th>Handlinger</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Screening rows will be populated here -->
                    </tbody>
                </table>
            </div>

        </section>
    </main>

</div>
<script th:src="@{/JS/sidebar.js}"></script>
<script th:src="@{/JS/CreateScreening.js}"></script>
</body>
</html>
