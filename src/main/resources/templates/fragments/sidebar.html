<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
<aside th:fragment="sidebar" class="sidebar">
    <h2>Medarbejderpanel</h2>
    <div class="sidebar-group">
        <button class="sidebar-item" onclick="toggleFilmMenu()"> <!-- Vi kan bruge ' active' på sidebar-item for bedre visualisering i fremtiden-->
            <span class="sidebar-icon">
                <i class="fa-solid fa-video"></i>
            </span>
            <span>Film</span>
            <span class="sidebar-arrow" id="filmArrow">⌄</span>
        </button>

        <div class="sidebar-submenu" id="filmMenu">
            <a href="/movies/create" class="sidebar-subitem">Opret film</a>
            <a href="/movies/edit" class="sidebar-subitem">Se film</a>
        </div>
    </div>

    <a href="/screenings/create" class="sidebar-item">
        <span class="sidebar-icon">
            <i class="fa fa-film" aria-hidden="true"></i>

        </span>
        <span>Forestillinger</span>
    </a>

    <a href="/program" class="sidebar-item">
        <span class="sidebar-icon">
            <i class="fa-solid fa-clapperboard" aria-hidden="true"></i>
        </span>
        <span>Program</span>
    </a>

    <div class="sidebar-group">
        <button class="sidebar-item" onclick="toggleKioskMenu()">
            <span class="sidebar-icon">
                <i class="fa-solid fa-mug-hot" aria-hidden="true"></i>
            </span>
            <span>Kiosk</span>
            <span class="sidebar-arrow" id="kioskArrow">⌄</span>
        </button>

        <div class="sidebar-submenu" id="kioskMenu">
            <a href="/kiosk/sell" class="sidebar-subitem">Sælg vare</a>
            <a href="/kiosk/create" class="sidebar-subitem">Opret vare</a>
        </div>
    </div>

    <a href="/settings" class="sidebar-item">
        <span class="sidebar-icon">
            <i class="fa-solid fa-gear" aria-hidden="true"></i>
        </span>
        <span>Indstillinger</span>
    </a>

</aside>
</body>
</html>
