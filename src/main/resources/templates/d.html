```html
<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Opret forestilling | KinoXP</title>

    <link rel="stylesheet" th:href="@{/CSS/Stylesheet.css}">
</head>

<body>

<!-- Fælles navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Layout med sidebar og indhold -->
<div class="page-layout">

    <!-- Fælles sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Den valgte userstory -->
    <main class="main-content">

        <section class="content-section">

            <div class="header">
                <h1>Opret forestilling</h1>
            </div>

            <div class="form-container">

                <form id="screeningForm">

                    <div class="form-group">
                        <label for="screen">Sal:</label>

                        <select id="screen" name="screen" required>
                            <option value="">Vælg en sal</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="movie">Film:</label>

                        <select id="movie" name="movie" required>
                            <option value="">Vælg en film</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="startTime">Starttidspunkt:</label>

                        <input
                                type="datetime-local"
                                id="startTime"
                                name="startTime"
                                required>
                    </div>

                    <div class="form-group">
                        <label for="endTime">Sluttidspunkt:</label>

                        <input
                                type="datetime-local"
                                id="endTime"
                                name="endTime"
                                required>
                    </div>

                    <div class="button-group">
                        <button type="submit" id="submitBtn">
                            Opret forestilling
                        </button>

                        <button type="reset" id="resetBtn" class="cancel">
                            Nulstil
                        </button>
                    </div>

                </form>

            </div>

            <p class="message" id="status" role="status"></p>

        </section>

    </main>

</div>

<!-- JavaScript til oprettelse af forestilling -->
<script th:src="@{/JS/CreateScreening.js}"></script>

</body>
</html>
```
