<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="UTF-8">
    <title>Create Screening</title>
    <link rel="stylesheet" href="/CSS/Stylesheet.css">
</head>
<body>
<div th:replace="~{Fragments/Sidebar :: sidebar}"></div>

<div class="main-content">
    <div class="header">
        <h1>Opret forestilling</h1>
    </div>

    <div class="form-container">
        <form id="screeningForm">
            <div class="form-group">
                <label for="screen">Sal:</label>
                <select id="screen" name="screen" required>
                    <option value="">Vælg en sal</option>
                </select>
            </div>
            <div class="form-group">
                <label for="movie">Film:</label>
                <select id="movie" name="movie" required>
                    <option value="">Vælg en film</option>
                </select>
            </div>
            <div class="form-group">
                <label for="startTime">Start tidspunkt:</label>
                <input type="datetime-local" id="startTime" name="startTime" required>
            </div>
            <div class="form-group">
                <label for="endTime">Slut tidspunkt:</label>
                <input type="datetime-local" id="endTime" name="endTime" required>
            </div>
            <div class="button-group">
                <button type="submit" id="submitBtn">Opret forestilling</button>
                <button type="reset" id="resetBtn" class="cancel">Nulstil</button>
            </div>
        </form>
    </div>
    <p id="status" role="status"></p>
</div>

<script src="/JS/CreateScreening.js"></script>
</body>
</html>
