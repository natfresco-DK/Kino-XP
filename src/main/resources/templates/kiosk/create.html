<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>Opret vare | KinoXP</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content screening-page">
        <section class="content-section screening-form-card">
            <div class="header">
                <h1>Opret vare</h1>
            </div>

            <div class="form-container">
                <form id="productForm">
                    <div class="form-group">
                        <label for="productName">Navn</label>
                        <input type="text" id="productName" name="productName" maxlength="255" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Pris (kr.)</label>
                        <input type="number" id="price" name="price" min="0.01" max="99999999.99" step="0.01" required>
                    </div>

                    <div class="button-group">
                        <button type="submit">Opret vare</button>
                    </div>
                </form>
                <p class="message" id="createStatus" role="status"></p>
            </div>
        </section>

        <section class="content-section screening-list-card">
            <div class="header">
                <h2>Varer</h2>
            </div>

            <div class="table-container">
                <table id="productsTable">
                    <thead>
                    <tr>
                        <th>Vare</th>
                        <th>Pris</th>
                    </tr>
                    </thead>
                    <tbody id="productList">
                    </tbody>
                </table>
            </div>
            <p class="message" id="listStatus" role="status"></p>
        </section>
    </main>

</div>

<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/KioskCreate.js}"></script>
</body>
</html>
