<!DOCTYPE html>
<html lang="da">

<head>
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>KinoXP - Opret film</title></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content screening-page">
        <section class="content-section screening-form-card">
            <div class="header">
                <h1>Opret film</h1>
                <p class="subtitle">Indtast filmens oplysninger</p>
            </div>
            <p id="message"></p>

            <div class="form-container">
                <form id="movieForm">
                    <div class="form-group">
                        <label for="title">Titel <span class="req">*</span></label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Beskrivelse <span class="req">*</span></label>
                        <textarea id="description" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="genre">Genre <span class="req">*</span></label>
                        <input type="text" id="genre" placeholder="Sci-Fi, Action" required>
                    </div>

                    <div class="form-group">
                        <label for="actors">Skuespillere <span class="req">*</span></label>
                        <input type="text" id="actors" placeholder="Hayden Christensen, Ewan McGregor, Natalie Portman" required>
                    </div>

                    <div class="form-group">
                        <label for="releaseYear">Udgivelsesår <span class="req">*</span></label>
                        <input type="number" id="releaseYear" min="1888" required>
                    </div>


                    <div class="row">

                        <div class="form-group">
                            <label for="ageLimit">Aldersgrænse</label>
                            <select id="ageLimit" required>
                                <option value="FROM_16">16 år</option>
                                <option value="FROM_18">18 år</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="duration">Spilletid (antal minutter)</label>
                            <input type="number" id="duration" min="1" step="1" required>
                        </div>

                    </div>

                    <div class="button-group">
                        <button type="submit" id="submitBtn">Opret forestilling</button>
                        <button type="reset" id="resetBtn" class="cancel">Annuller</button>
                    </div>

                </form>
            </div>
            <p class="message" id="status" role="status"></p>
        </section>

    </main>

</div>


<script th:src="@{/JS/script.js}"></script>
<script th:src="@{/JS/sidebar.js}"></script>


</body>
</html>
