<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common-head}"></th:block>
    <title>Se Film</title>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content screening-page movie-edit-page">
        <section class="content-section screening-form-card">
            <div class="header">
                <h1>Film</h1>
            </div>

            <table >
                <thead>
                <tr>
                    <th>Titel</th>
                    <th>Beskrivelse</th>
                    <th>Genre</th>
                    <th>Varighed (min)</th>
                    <th>Skuespillere</th>
                    <th>Udgivelses år</th>
                    <th>Aldersgrænse</th>
                    <th>Handling</th>
                </tr>
                </thead>
                <tbody id="movie-list"></tbody>
            </table>
        </section>


        <section class="movie-edit-modal" id="edit-section" hidden role="dialog"
                 aria-modal="true" aria-labelledby="edit-title">
            <div class="movie-edit-modal__content">
                <div class="header">
                    <h2 id="edit-title">Rediger film</h2>
                    <button type="button" class="movie-edit-modal__close" id="cancel"
                            aria-label="Luk redigering"></button>
                </div>

                <form id="edit-form">
                    <input type="hidden" id="id">
                    <label>Titel <input id="title" required></label>
                    <label>Beskrivelse <input id="description"></label>
                    <label>Genre <input id="genre"></label>
                    <label>Varighed i minutter <input id="duration" type="number" min="0"></label>
                    <label>Skuespillere <input id="actors"></label>
                    <label>Udgivelsesår <input id="releaseYear" type="number"></label>
                    <label>Aldersgrænse
                        <select id="ageLimit">
                            <option value="FROM_16">16+</option>
                            <option value="FROM_18">18+</option>
                        </select>
                    </label>
                    <div class="movie-edit-modal__actions">
                        <button type="submit">Gem</button>
                        <button type="button" id="cancel-form">Annuller</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

</div>



<script th:src="@{/JS/EditMovies.js}"></script>
<script th:src="@{/JS/sidebar.js}"></script>


</body>
</html>
