<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <title>KinoXP - Opret film</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>

<aside class="sidebar">

    <div>
        <h1>Kino<span>XP</span></h1>
        <h3>Intern</h3>
    </div>

    <div class="user">
        <h3>Mario C.</h3>
        <p>Medarbejder</p>
        <button type="button">Log ud</button>
    </div>

</aside>


<main class="content">

    <h1>Opret film</h1>
    <p class="subtitle">Indtast filmens oplysninger</p>

    <form id="movieForm">

        <!-- Titel -->
        <div class="form-group">
            <label for="title">Titel</label>

            <input
                    type="text"
                    id="title"
                    required>
        </div>


        <!-- Beskrivelse -->
        <div class="form-group">
            <label for="description">Beskrivelse</label>

            <textarea
                    id="description"
                    required></textarea>
        </div>


        <!-- Genre -->
        <div class="form-group">
            <label for="genre">Genre / Kategori</label>

            <input
                    type="text"
                    id="genre"
                    placeholder="Sci-Fi, Action"
                    required>
        </div>


        <div class="row">

            <!-- Aldersgrænse -->
            <div class="form-group small">
                <label for="ageLimit">Aldersgrænse</label>

                <select
                        id="ageLimit"
                        required>

                    <option value="AGE_16">16 år</option>
                    <option value="AGE_18">18 år</option>

                </select>
            </div>


            <!-- Spilletid -->
            <div class="form-group small">
                <label for="duration">
                    Spilletid (antal minutter)
                </label>

                <input
                        type="number"
                        id="duration"
                        min="31"
                        required>
            </div>

        </div>


        <!-- Skuespillere -->
        <div class="form-group">
            <label for="actors">Skuespillere</label>

            <input
                    type="text"
                    id="actors"
                    placeholder="Matthew McConaughey, Anne Hathaway"
                    required>
        </div>


        <!-- Udgivelsesår -->
        <div class="form-group small">
            <label for="releaseYear">Udgivelsesår</label>

            <input
                    type="number"
                    id="releaseYear"
                    required>
        </div>


        <!-- Knapper -->
        <div class="buttons">

            <button type="submit">
                Opret
            </button>

            <button type="reset">
                Annuller
            </button>

        </div>

    </form>

</main>


<script src="../static/script.js"></script>

</body>

</html>
